<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      // The frozen learner bundle mounts <video>/<audio preload="metadata">
      // pairs for the avatar lectures; Chromium eagerly fetches hundreds of
      // KB per file and aborts (each webm was downloading ~3x per home load,
      // ~2.5MB wasted). Coerce media preloads to 'none' before any fetch
      // starts — posters still render, playback fetches on user play.
      (() => {
        const proto = window.HTMLMediaElement && HTMLMediaElement.prototype;
        if (!proto) return;
        const desc = Object.getOwnPropertyDescriptor(proto, 'preload');
        if (desc && desc.set) {
          Object.defineProperty(proto, 'preload', {
            configurable: true,
            get() { return desc.get.call(this); },
            set(v) { desc.set.call(this, v === 'metadata' || v === 'auto' ? 'none' : v); },
          });
        }
        const setAttr = proto.setAttribute;
        proto.setAttribute = function (name, value) {
          if (String(name).toLowerCase() === 'preload' && (value === 'metadata' || value === 'auto')) value = 'none';
          return setAttr.call(this, name, value);
        };
      })();
    </script>
    <script>
      (() => {
        const lockThemeColor = () => {
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta && meta.getAttribute('content') !== '#be1a2f') meta.setAttribute('content', '#be1a2f');
        };
        lockThemeColor();
        new MutationObserver(lockThemeColor).observe(document.head, { childList: true, subtree: true, attributes: true });
      })();
    </script>

    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const preserveChildrenAs = (node, tagName) => {
          const replacement = document.createElement(tagName);
          for (const attr of node.attributes) replacement.setAttribute(attr.name, attr.value);
          while (node.firstChild) replacement.appendChild(node.firstChild);
          node.replaceWith(replacement);
          return replacement;
        };

        const replaceText = (root, replacements) => {
          const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
          const nodes = [];
          while (walker.nextNode()) nodes.push(walker.currentNode);
          nodes.forEach((node) => {
            let value = node.nodeValue;
            replacements.forEach(([from, to]) => {
              value = value.replaceAll(from, to);
            });
            node.nodeValue = value;
          });
        };

        const ensureSinglePageHeading = () => {
          if (document.querySelector('h1')) return;
          const firstSectionHeading = document.querySelector('main h2, #root h2');
          if (firstSectionHeading) preserveChildrenAs(firstSectionHeading, 'h1');
        };

        const addPreviewNote = (headingText, noteId, noteText) => {
          if (document.getElementById(noteId)) return;
          const heading = [...document.querySelectorAll('h1, h2')]
            .find((node) => node.textContent.replace(/\s+/g, ' ').trim() === headingText);
          if (!heading) return;
          const note = document.createElement('div');
          note.id = noteId;
          note.className = 'tp-preview-note';
          note.textContent = noteText;
          heading.insertAdjacentElement('afterend', note);
        };

        const improveLearnerEntry = () => {
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#be1a2f');

          document.querySelectorAll('button').forEach((button) => {
            const label = button.textContent.replace(/\s+/g, ' ').trim();
            if (label === 'Review the credential') button.textContent = 'Start learning';
            if (label === 'View catalog') button.textContent = 'Explore catalog';
            if (label === 'Instructor') button.textContent = 'Instructor tools';
            if ((label === '🌙' || label === '☀️') && !button.getAttribute('aria-label')) {
              button.setAttribute('aria-label', 'Toggle color theme');
            }
          });

          // Enrolled learners (handbook enrollment stores hb:learner_name)
          // get greeted by first name instead of the "Guest" preview copy.
          // Both branches are idempotent under the mutation observer: the
          // rewritten output never contains the source string.
          let tpFirstName = '';
          try {
            tpFirstName = (localStorage.getItem('hb:learner_name') || '').trim().split(/\s+/)[0] || '';
          } catch (_) {}

          replaceText(document.getElementById('root'), [
            ['Admin Portal', 'Instructor Portal Preview'],
            ['Super Admin', 'Instructor Preview'],
            ['Test Role:', 'Preview Role:'],
            tpFirstName
              ? ['Welcome back, Guest. Track your progress and badges.', 'Welcome back, ' + tpFirstName + '. Your handbook progress is recorded to your learner record.']
              : ['Welcome back, Guest. Track your progress and badges.', 'Preview dashboard for a sample learner. Sign in to save progress, certificates, and submissions.'],
          ]);

          // The dashboard greeting renders as three sibling text nodes
          // ("Welcome back, " + "Guest" + ". Track your progress and
          // badges."), so the per-text-node pass above cannot match it —
          // rewrite the whole paragraph. Idempotent: the rewritten text
          // never re-matches the source sentence.
          [...document.querySelectorAll('#root p')].forEach((p) => {
            const text = p.textContent.replace(/\s+/g, ' ').trim();
            if (text !== 'Welcome back, Guest. Track your progress and badges.') return;
            p.textContent = tpFirstName
              ? 'Welcome back, ' + tpFirstName + '. Your handbook progress is recorded to your learner record.'
              : 'Preview dashboard for a sample learner. Sign in to save progress, certificates, and submissions.';
          });

          const logoHeading = [...document.querySelectorAll('h1')]
            .find((heading) => heading.textContent.replace(/\s+/g, ' ').trim() === 'TeachPlay');
          if (logoHeading) preserveChildrenAs(logoHeading, 'div');

          [...document.querySelectorAll('h4')].forEach((heading) => {
            const text = heading.textContent.replace(/\s+/g, ' ').trim();
            if (text === 'The University of Alabama') preserveChildrenAs(heading, 'h3');
          });

          ensureSinglePageHeading();
          addPreviewNote('My Dashboard', 'tp-dashboard-preview-note', tpFirstName
            ? 'Preview dashboard — your handbook progress is recorded to your learner record; sign-in for saved submissions is coming.'
            : 'This dashboard is a signed-out preview. Learners should sign in before submitting evidence or expecting progress to persist.');
          addPreviewNote('Management Console', 'tp-instructor-preview-note', 'Instructor tools are preview-only until an authorized instructor signs in.');
        };

        improveLearnerEntry();
        // Disconnect while rewriting and debounce to one pass per frame:
        // reacting to our own mutations re-entered improveLearnerEntry in a
        // feedback loop, thrashing React-owned subtrees (remounting <video>/
        // <audio> mid-preload → repeated ERR_ABORTED media requests).
        const observedRoot = document.getElementById('root');
        let rewriteScheduled = false;
        const observer = new MutationObserver(() => {
          if (rewriteScheduled) return;
          rewriteScheduled = true;
          requestAnimationFrame(() => {
            rewriteScheduled = false;
            observer.disconnect();
            try { improveLearnerEntry(); } finally {
              observer.observe(observedRoot, { childList: true, subtree: true });
            }
          });
        });
        observer.observe(observedRoot, { childList: true, subtree: true });
      });
    </script>
