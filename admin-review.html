<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeachPlay · Instructor review</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#101828;background:#f6f8fb}body{margin:0}main{max-width:1100px;margin:0 auto;padding:32px 20px}header{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:24px}h1{margin:0;font-size:28px}p{color:#475467;line-height:1.5}.panel,article{background:#fff;border:1px solid #d9e1ec;border-radius:10px;padding:18px;margin:14px 0}form{display:flex;gap:10px;flex-wrap:wrap}input,button{font:inherit;min-height:42px;border-radius:7px;padding:8px 12px}input{border:1px solid #98a2b3;flex:1 1 360px}button{border:0;background:#9e1b32;color:white;font-weight:700;cursor:pointer}button.secondary{background:#1f3a5f}button.danger{background:#6b1022}.meta{font-size:13px;color:#667085}.status{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2f6;font-weight:700;font-size:12px}.status.needs_review{background:#fff4d6;color:#7a4b00}.status.approved{background:#e6f7f2;color:#08745c}.status.rejected{background:#fdecec;color:#9b1c1c}pre{white-space:pre-wrap;background:#f8fafc;padding:12px;border-radius:7px;max-height:260px;overflow:auto}button:disabled{opacity:.55;cursor:not-allowed}
  </style>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#161616;background:#fff;line-height:1.45}
    *,*:before,*:after{box-sizing:border-box}
    body{margin:0;background:#fff;color:#161616}
    body:before{content:"";display:block;height:6px;background:#9e1b32}
    main{width:min(1440px,100%);max-width:none;margin:0 auto;padding:94px 64px 80px}
    header{display:block;max-width:860px;margin:0 0 30px}
    header .meta{margin:0 0 14px;color:#9e1b32;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
    h1{margin:0 0 12px;font-size:46px;line-height:1.08;letter-spacing:-.035em;font-weight:750}
    p{margin:0 0 12px;color:#4a4a4a;line-height:1.55;font-size:15px}
    .panel,article{background:#fff;border:1px solid #e4e6e8;border-radius:8px;padding:20px;margin:16px 0}
    main>.panel:first-of-type{background:#fdf4f5;border-color:#9e1b32}
    form{display:flex;align-items:end;gap:12px;flex-wrap:wrap}
    form .meta{display:block;flex-basis:100%;margin:0;color:#72111f;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
    input,button{font:inherit;min-height:40px;border-radius:4px;padding:8px 12px}
    input{flex:1 1 360px;max-width:520px;border:1px solid #c9ccce;background:#fff;color:#161616}
    input:focus{outline:2px solid rgba(158,27,50,.22);outline-offset:2px;border-color:#9e1b32}
    button{border:1px solid #9e1b32;background:#9e1b32;color:#fff;font-weight:700;cursor:pointer}
    button.secondary{background:#fff;color:#9e1b32}
    button.danger{background:#fff;color:#72111f;border-color:#9e1b32}
    button:hover{filter:brightness(.96)}
    button:focus-visible{outline:2px solid #161616;outline-offset:2px}
    .meta{font-size:13px;color:#6b6f73}
    #message{margin:14px 0 0;color:#72111f;font-size:14px}
    article{width:100%;padding:22px;margin:16px 0}
    article .meta{margin-bottom:12px}
    .status{display:inline-block;padding:4px 8px;border-radius:4px;background:#f1f2f3;font-weight:700;font-size:12px;letter-spacing:.02em}
    .status.needs_review{background:#fff4d6;color:#7a4b00}
    .status.approved{background:#e6f7f2;color:#08745c}
    .status.rejected{background:#fdecec;color:#9b1c1c}
    article a{color:#9e1b32;text-underline-offset:3px}
    pre{white-space:pre-wrap;background:#fafafa;border:1px solid #e4e6e8;padding:12px;border-radius:4px;max-height:260px;overflow:auto}
    button:disabled{opacity:.55;cursor:not-allowed}
    @media(max-width:760px){main{padding:58px 20px 60px}h1{font-size:38px}form{align-items:stretch;flex-direction:column}input,button{width:100%;max-width:none}}
  </style>
</head>
<body><main>
  <header><div><p class="meta">TeachPlay / protected instructor surface</p><h1>Portfolio final review</h1><p>Automated analysis is advisory only. Final approval here does not issue a credential until the rubric and credential gate also pass.</p></div></header>
  <section class="panel"><form id="auth"><label class="meta" for="key">Optional issuer key</label><input id="key" type="password" autocomplete="off" placeholder="Not required when Cloudflare Access recognizes you"><button class="secondary">Load reviews</button></form><p id="message" role="status"></p></section>
  <section id="reviews" aria-live="polite"></section>
</main><script>
(() => { const auth = document.querySelector('#auth'), key = document.querySelector('#key'), message = document.querySelector('#message'), reviews = document.querySelector('#reviews'); let issuerKey = '';
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const readResponse = async (r) => { const type = r.headers.get('content-type') || ''; if (!type.includes('application/json')) throw Error(r.status === 401 || r.redirected ? 'Cloudflare Access login is required. Sign in, then reload this page.' : `Review API returned ${r.status}.`); const d = await r.json(); if(!r.ok) throw Error(d.error || 'Could not load reviews'); return d; };
  const load = async () => { const r = await fetch('/api/admin/portfolio-review', {headers:{Authorization:'Bearer '+issuerKey}}); const d = await readResponse(r); reviews.innerHTML = (d.reviews||[]).map(x => { const a=x.analysis||{}; return `<article><span class="status ${esc(x.status)}">${esc(x.status)}</span><p class="meta">${esc(x.id)} · learner ${esc(x.learner_id)} · ${esc(x.created_at)}</p><p><a href="${esc(x.url)}" target="_blank" rel="noreferrer">${esc(x.url)}</a></p><p>${esc(a.computational_artifact_summary || x.error_message || 'No analysis returned.')}</p>${a.risks?.length?`<p><strong>Risks</strong>: ${esc(a.risks.join(' · '))}</p>`:''}${x.status==='needs_review'?`<button data-action="final_approve" data-id="${esc(x.id)}">Final approve</button> <button class="danger" data-action="reject" data-id="${esc(x.id)}">Reject</button>`:''}</article>`; }).join('') || '<div class="panel">No portfolio reviews yet.</div>'; };
  auth.addEventListener('submit', async e => { e.preventDefault(); issuerKey=key.value; message.textContent='Loading…'; try { await load(); message.textContent=issuerKey ? 'Loaded with the session key.' : 'Loaded through Cloudflare Access.'; } catch(err) { message.textContent=err.message; } });
  reviews.addEventListener('click', async e => { const b=e.target.closest('button[data-action]'); if(!b) return; b.disabled=true; try { const r=await fetch('/api/admin/portfolio-review',{method:'POST',headers:{Authorization:'Bearer '+issuerKey,'Content-Type':'application/json'},body:JSON.stringify({id:b.dataset.id,action:b.dataset.action})}); const d=await readResponse(r); message.textContent=d.next; await load(); } catch(err) { message.textContent=err.message; b.disabled=false; } });
})();</script></body></html>
